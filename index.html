<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Operators</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body{
            background-color: rgb(27, 7, 7);
        }
        #FORM{
            max-width: 600px;
            margin: 50px auto;
            box-shadow: rgba(0, 0, 0, 0.3) 0px 3px 5px 3px; 
            border-radius: 25px;
            background-color: whitesmoke;
            overflow: hidden;
        }
        #HEADER {
            text-align: center; 
            padding: 20px; 
            background-color: rgb(138, 5, 5);
            color: white;
            margin: 0;
        }
        #BODY{
            padding: 25px;
        }
    </style>
</head>
<body>

    <div id="FORM">
        <div id="HEADER">
            <h3 class="mb-0">student grade manager</h3>
        </div>
        <div id="BODY">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="firstname" class="form-label fw-semibold">First Name</label>
                    <input type="text" id="firstname" class="form-control" placeholder="ex. Isabelle">
                </div>
                <div class="col-md-6">
                    <label for="lastname" class="form-label fw-semibold">Last Name</label>
                    <input type="text" id="lastname" class="form-control" placeholder="ex. Rivera">
                </div>
            </div>

            <div class="d-grid mb-4">
                <button type="button" id="add-btn" class="btn d-block" style="margin: 3%; margin-top: 4.5%; width: 40%; justify-self: center; background-color:rgb(138, 5, 5); font-weight: bold; font-size: large; color: whitesmoke;">ADD STUDENT</button>
            </div>

            <div id="OUTPUT" class="mt-3"></div>

            <script type="py" src="main.py"></script>

        </div>
    </div>

</body>
</html>
